# Deploy to Cloudflare on push to main.
#
# WHY: the old deploy path was a Cloudflare-dashboard Git integration (no repo
# file) that silently stopped firing 2026-05-18 — pushes landed, nothing
# deployed, prod went stale with zero signal. This in-repo workflow makes
# deploy explicit and version-controlled.
#
# INERT-SAFE: until the two secrets below exist, the job is a clean GREEN
# no-op (a single notice, no build, no failure email). It auto-activates the
# moment the secrets are added — no workflow edit needed.
#
# ONE-TIME ACTIVATION (only the repo owner can set secrets — I cannot):
#   GitHub repo → Settings → Secrets and variables → Actions → New secret:
#     CLOUDFLARE_API_TOKEN  = <Cloudflare "Edit Workers" API token>
#     CLOUDFLARE_ACCOUNT_ID = 3149ac14b33df309a6ce83201305a973
#   Then disconnect the old Cloudflare-dashboard Git integration (avoids
#   double deploys). Until activated, manual deploy remains the path:
#   `rm -rf out && npm run build && npx wrangler deploy` (see STATUS.md).

name: Deploy to Cloudflare

# PARKED 2026-05-18: auto-run on push is disabled so it stops fail-emailing on
# every push while the post-gate build failure is unresolved (deprioritized per
# user — manual `npx wrangler deploy` is the working path). Re-add the `push:`
# trigger below to reactivate once the remaining build/deploy step is fixed.
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Activation check (inert = green no-op, no failure email)
        id: gate
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::notice title=Deploy inert::Cloudflare secrets not set — skipping deploy (no-op). Add CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID to activate."
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.active == 'true'
        uses: actions/checkout@v4

      - if: steps.gate.outputs.active == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - if: steps.gate.outputs.active == 'true'
        run: npm ci

      - if: steps.gate.outputs.active == 'true'
        name: Build (runs prebuild gate + parse, then static export)
        run: npm run build

      - if: steps.gate.outputs.active == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
